[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolsmith"
version = "0.4.0"
description = "Self-repairing MCP tool interfaces with a variance-aware regression gate"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "langgraph>=0.2.28",
    "langchain-core>=0.3",
    "mcp>=1.1",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "matplotlib>=3.8",
    "ruff>=0.5",
]

[project.scripts]
toolsmith = "toolsmith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
